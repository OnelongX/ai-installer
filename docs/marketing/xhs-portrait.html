<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ai-installer xhs poster</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1440px; overflow: hidden;
        font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif;
        color: #f0fdf4;
        background: radial-gradient(ellipse at 30% 10%, #1a2a6b 0%, transparent 55%),
                    radial-gradient(ellipse at 80% 95%, #2a1a5c 0%, transparent 60%),
                    linear-gradient(180deg, #050b1a 0%, #0a1530 50%, #060c1e 100%);
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(56,189,248,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56,189,248,0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse at center top, black 0%, transparent 90%);
      }
      .wrap {
        position: relative; width: 100%; height: 100%;
        padding: 80px 80px 70px;
        display: flex; flex-direction: column;
      }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .tag {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 18px; border-radius: 999px;
        background: rgba(56,189,248,0.1);
        border: 1px solid rgba(56,189,248,0.4);
        color: #38bdf8; font-size: 18px; letter-spacing: 0.3em;
        font-weight: 700; text-transform: uppercase;
      }
      .tag::before {
        content: ''; width: 8px; height: 8px; border-radius: 50%;
        background: #38bdf8; box-shadow: 0 0 10px #38bdf8;
      }
      .version { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; color: #64748b; }
      h1 {
        margin-top: 36px;
        font-size: 168px; line-height: 0.9; letter-spacing: -0.04em;
        font-weight: 800;
        background: linear-gradient(180deg, #ffffff 0%, #b8d4ff 100%);
        background-clip: text; -webkit-background-clip: text; color: transparent;
        text-shadow: 0 0 60px rgba(56,189,248,0.3);
      }
      h1 .accent {
        background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
        background-clip: text; -webkit-background-clip: text; color: transparent;
      }
      .hook {
        margin-top: 32px;
        font-size: 48px; line-height: 1.3; color: #f0fdf4; font-weight: 700;
      }
      .hook .hl {
        background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
        background-clip: text; -webkit-background-clip: text; color: transparent;
      }
      .pain {
        margin-top: 18px;
        font-size: 26px; line-height: 1.5; color: #cbd5e1; font-weight: 400;
      }
      .pain .strike { text-decoration: line-through; color: #64748b; }

      .steps {
        margin-top: 50px;
        display: flex; flex-direction: column; gap: 20px;
      }
      .step {
        display: flex; align-items: center; gap: 20px;
        padding: 22px 26px; border-radius: 20px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(99,102,241,0.4);
      }
      .step .num {
        flex: 0 0 auto;
        width: 56px; height: 56px; border-radius: 14px;
        display: grid; place-items: center;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 26px; font-weight: 700;
        background: rgba(56,189,248,0.18);
        color: #38bdf8;
        border: 1px solid rgba(56,189,248,0.5);
      }
      .step.v .num { background: rgba(168,85,247,0.18); color: #c4b5fd; border-color: rgba(168,85,247,0.5); }
      .step .text { font-size: 28px; font-weight: 600; color: #f0fdf4; line-height: 1.3; }
      .step .text small { display: block; font-size: 20px; font-weight: 400; color: #94a3b8; margin-top: 4px; }

      .bottom {
        margin-top: auto;
        display: flex; flex-direction: column; gap: 22px;
      }
      .cta {
        padding: 24px 32px; border-radius: 22px;
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
        color: #050b1a; font-size: 30px; font-weight: 700;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 0 50px rgba(56,189,248,0.4);
      }
      .cta .arrow { font-size: 38px; }
      .repo {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 22px; color: #94a3b8; text-align: center;
      }
      .repo b { color: #f0fdf4; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="top">
        <span class="tag">Powered by LiveToken</span>
        <span class="version">v0.1.2 · Windows 10+</span>
      </div>

      <h1><span class="accent">ai-</span><br/>installer</h1>

      <p class="hook">
        <span class="hl">三步</span>装好<br/>
        Claude Code &amp; Codex
      </p>
      <p class="pain">
        <span class="strike">winget → npm → 设环境变量 → 改 config</span><br/>
        现在：双击 → 输入 Key → 自动完成。
      </p>

      <div class="steps">
        <div class="step">
          <div class="num">01</div>
          <div class="text">环境自检 + 自动补 Node<small>winget · 路径多层兜底</small></div>
        </div>
        <div class="step v">
          <div class="num">02</div>
          <div class="text">npm 装 CLI + 写配置<small>BASE_URL 直连 LiveToken</small></div>
        </div>
        <div class="step">
          <div class="num">03</div>
          <div class="text">Key 入用户环境变量<small>新终端开箱可用</small></div>
        </div>
      </div>

      <div class="bottom">
        <div class="cta">
          <span>免费下载 · 开源</span>
          <span class="arrow">→</span>
        </div>
        <div class="repo">github.com/<b>OnelongX/ai-installer</b></div>
      </div>
    </div>
  </body>
</html>
